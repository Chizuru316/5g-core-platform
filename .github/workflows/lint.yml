name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh network/*.sh tests/**/*.sh core/free5gc/cert/*.sh
      - name: YAML lint
        run: pipx run yamllint -d relaxed .
